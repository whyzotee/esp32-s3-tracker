; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V3]
; Arduino 3.3.12 / IDF 5.5.5; includes the ESP32-S3 IPC stack fix.
; Requires PlatformIO Core 6.2.0 or newer.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = heltec_wifi_lora_32_V3
; Wireless Shell V3 uses the same ESP32-S3/8MB base profile.
; Use the framework's existing Shell variant; custom wiring is in board_pins.h.
monitor_speed = 115200
; Route Serial logs to UART0 on J4 (set CDC_ON_BOOT=1 for native USB on J1).
build_flags = 
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
lib_deps = 
	jgromes/RadioLib@7.8.1
	mikalhart/TinyGPSPlus@1.1.0
